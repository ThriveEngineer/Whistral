name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (macOS, arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Whistral.xcodeproj \
            -scheme Whistral \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            | tee build.log
